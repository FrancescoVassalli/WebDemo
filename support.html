<head>
    <!-- ===== BRAND STYLES: Ralston / Olde Town ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        /* ---------- Color tokens ---------- */
        :root {
            --cobalt: #1F32B8;
            /* Ralston Cobalt: sign fields, tees, wordmark */
            --gold: #F6B91D;
            /* Locust Gold: center line, fall leaves */
            --cream: #FFF6DC;
            /* Paper Cream: default ground, never pure white */

            --brick: #B8472A;
            /* Olde Town Brick (spot) */
            --green: #1E5A4A;
            /* Lamp Post Green (spot) */
            --sky: #4FA3E8;
            /* Front Range Sky (spot) */
            --ink: #12153A;
            /* Porch Ink: text, outlines, hard shadows */

            --font-display: 'Bowlby One', sans-serif;
            --font-condensed: 'Barlow Condensed', sans-serif;
            --font-body: 'Barlow', sans-serif;

            --border-w: 4px;
            --shadow-offset: 5px;

            /* Spacing scale */
            --space-1: .5rem;
            --space-2: 1rem;
            --space-3: 1.5rem;
            --space-4: 2.5rem;
            --space-5: 4rem;

            --content-width: 1100px;
        }

        /* ---------- Base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 100%;
            scroll-padding-top: 60px;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: var(--font-body);
            font-weight: 400;
            font-size: 1.5rem;
            /* 17px */
            line-height: 1.55;
        }

        /* Page wrapper: centers content and gives side margins */
        .container {
            width: 100%;
            max-width: var(--content-width);
            margin: 0 auto;
            padding: var(--space-4) var(--space-3);
        }

        .join-us {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
        }

        .join-us h2,
        .join-us .btn {
            margin: 0;
        }

        /* ---------- Headings ---------- */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .display {
            font-family: var(--font-display);
            font-weight: 400;
            color: var(--ink);
            line-height: 1.1;
            margin: 1.5em 0 .5em;
        }

        /* No extra space above the first element in a container */
        h1:first-child,
        h2:first-child,
        h3:first-child,
        h4:first-child,
        h5:first-child,
        h6:first-child {
            margin-top: 0;
        }

        h1 {
            font-size: clamp(2.25rem, 5vw, 3.5rem);
            margin-top: 0;
            text-shadow: 3px 3px 0 var(--gold);
        }

        h2 {
            font-size: clamp(1.875rem, 4vw, 2.75rem);
            text-shadow: 3px 3px 0 var(--gold);
        }

        h3 {
            font-size: clamp(1.5rem, 3vw, 2rem);
            text-shadow: 3px 3px 0 var(--gold);
        }

        h4 {
            font-size: 1.5rem;
            text-shadow: 2px 2px 0 var(--gold);
        }

        h5 {
            font-size: 1.25rem;
            text-shadow: 2px 2px 0 var(--gold);
        }

        h6 {
            font-size: 1.0625rem;
            text-shadow: 2px 2px 0 var(--gold);
        }

        /* Headings that directly follow each other (e.g. title + subtitle) */
        h1+h2,
        h2+h3,
        h3+h4 {
            margin-top: .75em;
        }

        /* ---------- Text ---------- */
        p {
            margin: 0 0 1em;
        }

        ul,
        ol {
            margin: 0 0 1em;
            padding-left: 1.5em;
        }

        li {
            margin-bottom: .35em;
        }

        blockquote {
            margin: 1.5em 0;
            padding: .5em 0 .5em 1em;
            border-left: 6px solid var(--gold);
        }

        q {
            box-shadow: inset 0 -2px 0 var(--gold);
            padding: 0 .2em;
        }

        cite {
            font-style: normal;
            font-weight: 600;
            text-decoration: underline;
            text-decoration-color: var(--gold);
            text-decoration-thickness: 2px;
            text-underline-offset: .15em;
        }

        hr {
            margin: 2em 0;
            border: 0;
            border-top: 3px solid var(--ink);
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .accountability-intro {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: var(--space-3);
        }

        .accountability-intro p {
            margin-bottom: 0;
        }

        .accountability-photo {
            margin: 0 var(--shadow-offset) var(--shadow-offset) 0;
            border: var(--border-w) solid var(--ink);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
        }

        .accountability-photo img {
            display: block;
            width: 100%;
        }

        .articlePhoto {
            float: right;
            width: min(32%, 240px);
            margin: 0 var(--shadow-offset) var(--space-2) var(--space-3);
        }

        a {
            color: var(--cobalt);
            font-weight: 600;
        }

        a:hover {
            color: var(--brick);
        }

        q a,
        q a:hover {
            color: inherit;
            font-weight: inherit;
        }

        .condensed {
            font-family: var(--font-condensed);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .body {
            font-family: var(--font-body);
            font-weight: 400;
        }

        .body-bold {
            font-family: var(--font-body);
            font-weight: 600;
        }

        .lead {
            font-size: 1.25rem;
            line-height: 1.45;
            margin-bottom: 1.5em;
        }

        .kicker {
            font-family: var(--font-condensed);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 1.1rem;
            color: var(--brick);
            margin: 0 0 .75rem;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .kicker {
                color: var(--gold);
            }
        }

        .stat {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            line-height: 1;
            margin: 0 0 .15em;
        }

        .pledge .block-title {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
        }

        .pledge p {
            font-size: 1.2rem;
        }

        .bg-gold :is(h1, h2, h3, h4, h5, h6),
        .bg-sky :is(h1, h2, h3, h4, h5, h6) {
            text-shadow: 3px 3px 0 var(--cobalt);
        }


        /* ---------- Sections ---------- */
        section {
            margin: var(--space-5) 0;
        }

        section:first-child {
            margin-top: 0;
        }

        /* ---------- Color utilities ---------- */
        .bg-cobalt {
            background: var(--cobalt);
            color: #fff;
        }

        .bg-gold {
            background: var(--gold);
            color: var(--ink);
        }

        .bg-cream {
            background: var(--cream);
            color: var(--ink);
        }

        .bg-brick {
            background: var(--brick);
            color: #fff;
        }

        .bg-green {
            background: var(--green);
            color: #fff;
        }

        .bg-sky {
            background: var(--sky);
            color: var(--ink);
        }

        .bg-ink {
            background: var(--ink);
            color: var(--cream);
        }

        /* Headings and links inherit color on colored backgrounds */
        .bg-cobalt :is(h1, h2, h3, h4, h5, h6),
        .bg-brick :is(h1, h2, h3, h4, h5, h6),
        .bg-green :is(h1, h2, h3, h4, h5, h6) {
            color: #fff;
        }

        .bg-ink :is(h1, h2, h3, h4, h5, h6) {
            color: var(--cream);
        }

        .bg-cobalt a,
        .bg-brick a,
        .bg-green a,
        .bg-ink a {
            color: var(--gold);
        }

        .text-cobalt {
            color: var(--cobalt);
        }

        .text-gold {
            color: var(--gold);
        }

        .text-cream {
            color: var(--cream);
        }

        .text-brick {
            color: var(--brick);
        }

        .text-green {
            color: var(--green);
        }

        .text-sky {
            color: var(--sky);
        }

        .text-ink {
            color: var(--ink);
        }

        /* ---------- Hard-shadow block (cards / panels) ---------- */
        .block {
            border: var(--border-w) solid var(--ink);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
            padding: var(--space-2);
            margin: 0 var(--shadow-offset) var(--shadow-offset) 0;
            /* room for the shadow */
        }

        .block> :last-child {
            margin-bottom: 0;
        }

        .block-title {
            font-family: var(--font-condensed);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
            font-size: 1.75rem;
            line-height: 1.05;
            margin: 0 0 .25em;
        }

        .block-sub {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1rem;
            margin: 0 0 .25em;
        }

        .block-text {
            font-size: .875rem;
            line-height: 1.35;
            margin: 0;
        }

        /* Simple responsive grid for blocks */
        .grid {
            display: grid;
            gap: var(--space-3);
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            margin: var(--space-3) 0;
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-block;
            font-family: var(--font-condensed);
            font-weight: 800;
            font-size: 1.25rem;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: .04em;
            text-decoration: none;
            color: var(--ink);
            background: var(--gold);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            padding: .6em 1.4em;
            margin: 0 .5em .5em 0;
            cursor: pointer;
            transition: transform .08s, box-shadow .08s;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
            color: var(--ink);
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 var(--ink);
        }

        .btn-cobalt {
            background: var(--cobalt);
            color: #fff;
        }

        .btn-cobalt:hover {
            color: #fff;
        }

        /* ---------- Misc ---------- */
        .rule {
            /* double-yellow center line divider */
            height: 10px;
            border: 0;
            border-top: 3px solid var(--gold);
            border-bottom: 3px solid var(--gold);
            margin: var(--space-4) 0;
        }

        .outlined {
            border: 3px solid var(--ink);
        }

        .mark-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: .5rem;
            padding: .4rem 1rem;
            background: var(--ink);
        }

        .mark-nav a {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border: 2px solid var(--cream);
            transition: border-color .15s, transform .15s;
        }

        .mark-nav a:hover,
        .mark-nav a:focus-visible {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .mark-nav svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        :target {
            scroll-margin-top: 60px;
        }

        /* ---------- Small screens ---------- */
        @media (max-width: 600px) {
            .container {
                padding: var(--space-3) var(--space-2);
            }

            section {
                margin: var(--space-4) 0;
            }

            .accountability-intro {
                grid-template-columns: 1fr;
            }

            .join-us {
                align-items: flex-start;
                flex-direction: column;
            }

            .articlePhoto {
                width: min(42%, 200px);
            }
        }

        /* ---------- Print / PDF ---------- */
        @media print {

            *,
            *::before,
            *::after {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            html,
            body {
                background-color: var(--cream) !important;
            }

            .mark-nav {
                display: none;
            }

            .kicker {
                color: var(--brick);
            }

            .drawer,
            .drawer-backdrop {
                display: none;
            }
        }

        /* Brand tooltip for SVG links. Pure HTML + CSS, no JS.
        Usage: wrap the <svg> in <a class="tip"> and add a <span class="tip-text">. */
        .tip {
            --tip-ink: #12153A;
            /* Porch Ink: text, outlines, hard shadows */
            --tip-cream: #FFF6DC;
            /* Paper Cream: ground */
            --tip-gold: #F6B91D;
            /* Locust Gold: label chip */
            --tip-cobalt: #1F32B8;
            /* Ralston Cobalt: focus ring */
            --tip-shift: 6px;
            /* slide distance on show */
            position: relative;
            display: inline-block;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .tip>svg {
            display: block;
        }

        .tip:focus-visible {
            outline: 3px solid var(--tip-cobalt);
            outline-offset: 4px;
        }

        /* The bubble (default: above the SVG) */
        .tip-text {
            position: absolute;
            z-index: 100;
            left: 50%;
            bottom: calc(100% + 14px);
            box-sizing: border-box;
            width: max-content;
            max-width: 240px;
            padding: 10px 12px;
            background: var(--tip-cream);
            color: var(--tip-ink);
            border: 3px solid var(--tip-ink);
            box-shadow: 4px 4px 0 var(--tip-ink);
            font: 600 14px/1.3 'Barlow', sans-serif;
            letter-spacing: 0;
            text-align: left;
            text-transform: none;
            white-space: normal;
            transform: translate(-50%, var(--tip-shift));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
        }

        /* Label chip: <b>Goes to</b> */
        .tip-text b {
            display: block;
            width: fit-content;
            margin-bottom: 6px;
            padding: 3px 7px 2px;
            background: var(--tip-gold);
            color: var(--tip-ink);
            border: 2px solid var(--tip-ink);
            font: 800 12px/1 'Barlow Condensed', sans-serif;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        /* Pointer */
        .tip-text::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            box-sizing: border-box;
            width: 12px;
            height: 12px;
            margin-top: -3px;
            background: var(--tip-cream);
            border: 3px solid var(--tip-ink);
            border-top: 0;
            border-left: 0;
            transform: translateX(-50%) rotate(45deg);
        }

        /* Show on hover, keyboard focus, and tap */
        .tip:hover .tip-text,
        .tip:focus-visible .tip-text {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
            transition-delay: 0s;
        }

        /* Below the SVG: <a class="tip tip--bottom"> */
        .tip--bottom {
            --tip-shift: -6px;
        }

        .tip--bottom .tip-text {
            bottom: auto;
            top: calc(100% + 14px);
        }

        .tip--bottom .tip-text::after {
            top: auto;
            bottom: 100%;
            margin-top: 0;
            margin-bottom: -3px;
            border: 3px solid var(--tip-ink);
            border-bottom: 0;
            border-right: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .tip-text {
                transition: none;
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            html {
                scroll-behavior: smooth;
            }

            .drawer,
            .drawer-backdrop,
            .drawer-link,
            .drawer-tab {
                transition: none;
            }
        }

        .drawer {
            --drawer-w: min(320px, 85vw);
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 30;
            width: var(--drawer-w);
            /* extra 6px hides the hard shadow while closed */
            transform: translateX(calc(-100% - 6px));
            transition: transform .25s ease;
            pointer-events: none;
        }

        .drawer-toggle {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            margin: 0;
            opacity: 0;
        }

        .drawer-toggle:checked~.drawer {
            transform: none;
        }

        .drawer-panel {
            pointer-events: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--cream);
            color: var(--ink);
            border-right: var(--border-w) solid var(--ink);
            box-shadow: var(--shadow-offset) 0 0 var(--ink);
            /* keeps links out of the tab order while closed */
            visibility: hidden;
            transition: visibility 0s linear .25s;
        }

        .drawer-toggle:checked~.drawer .drawer-panel {
            visibility: visible;
            transition-delay: 0s;
        }

        .drawer-head {
            background: var(--cobalt);
            padding: var(--space-3) var(--space-3) var(--space-2);
            border-bottom: var(--border-w) solid var(--ink);
        }

        .drawer-title {
            margin: 0;
            font-size: 1.75rem;
            color: #fff;
            text-shadow: none;
        }

        .drawer-sub {
            margin: .5rem 0 0;
            font-size: 1rem;
            line-height: 1.3;
            color: var(--cream);
        }

        .drawer-list {
            list-style: none;
            margin: 0;
            padding: var(--space-2);
            display: grid;
            gap: var(--space-2);
        }

        .drawer-list li {
            margin: 0;
        }

        .drawer-link {
            display: block;
            padding: .75rem .9rem;
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
            border: 3px solid transparent;
            transition: transform .08s, box-shadow .08s, background .08s;
        }

        .drawer-link:hover {
            color: var(--ink);
            border-color: var(--ink);
            background: rgba(246, 185, 29, .3);
        }

        .drawer-link:focus-visible {
            outline: 3px solid var(--cobalt);
            outline-offset: 3px;
        }

        .drawer-link[aria-current="location"] {
            background: var(--gold);
            border-color: var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            transform: translate(-2px, -2px);
        }

        .drawer-link .kicker {
            display: block;
            margin: 0 0 .2rem;
            font-size: .95rem;
            letter-spacing: .04em;
        }

        .drawer-link-title {
            display: block;
            font-size: 1.15rem;
            line-height: 1.2;
        }

        /* Tab that travels with the drawer edge */
        .drawer-tab {
            pointer-events: auto;
            position: absolute;
            left: calc(100% + 6px);
            top: 50%;
            translate: 0 -50%;
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: 1rem .6rem;
            writing-mode: vertical-rl;
            font-family: var(--font-condensed);
            font-weight: 800;
            font-size: 1.25rem;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--gold);
            background: var(--cobalt);
            border: 3px solid var(--ink);
            border-left: 0;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: box-shadow .08s, transform .08s;
        }

        .drawer-tab:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .drawer-tab:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        .drawer-tab svg {
            width: 22px;
            height: 22px;
            flex: none;
        }

        .drawer-toggle:focus-visible~.drawer .drawer-tab {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        .drawer-tab svg {
            width: 22px;
            height: 22px;
            flex: none;
        }

        .drawer-tab .tab-close {
            display: none;
        }

        .drawer-toggle:checked~.drawer .tab-open {
            display: none;
        }

        .drawer-toggle:checked~.drawer .tab-close {
            display: inline;
        }

        .drawer-backdrop {
            position: fixed;
            inset: 0;
            z-index: 29;
            background: rgba(18, 21, 58, .55);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility 0s linear .2s;
        }

        @media (max-width: 900px) {
            .drawer-toggle:checked~.drawer-backdrop {
                opacity: 1;
                visibility: visible;
                transition-delay: 0s;
            }
        }

        .sign-form {
            box-sizing: border-box;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 28px;
            background: var(--cobalt);
            color: var(--cream);
            border: 4px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
            display: flex;
            flex-direction: column;
            gap: 20px;
            font-family: 'Barlow', sans-serif;
        }

        .sign-form *,
        .sign-form *::before,
        .sign-form *::after {
            box-sizing: border-box;
        }

        .sign-form label {
            display: block;
            margin-bottom: 6px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 20px;
            line-height: 1;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .sign-form input {
            display: block;
            width: 100%;
            padding: 12px 14px;
            background: var(--cream);
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 0;
            font-family: 'Barlow', sans-serif;
            font-weight: 600;
            font-size: 16px;
            /* 16px stops iOS from zooming on focus */
            line-height: 1.25;
            box-shadow: 3px 3px 0 var(--ink);
            transition: transform .08s ease, box-shadow .08s ease;
        }

        .sign-form input::placeholder {
            color: rgba(18, 21, 58, .6);
            font-weight: 400;
        }

        .sign-form input:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        .sign-form input:focus {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .sign-form input:user-invalid {
            border-color: var(--ink);
            background: #F6D9CF;
            /* warm blush, stays in the cream family */
        }

        .sign-form button {
            margin-top: 6px;
            padding: 14px 20px;
            background: var(--gold);
            color: var(--ink);
            border: 4px solid var(--ink);
            border-radius: 0;
            box-shadow: 5px 5px 0 var(--ink);
            font-family: 'Bowlby One', sans-serif;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition: transform .08s ease, box-shadow .08s ease;
        }

        .sign-form button:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .sign-form button:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        .sign-form button:focus-visible {
            outline: 3px solid var(--cream);
            outline-offset: 3px;
        }
    </style>
</head>
